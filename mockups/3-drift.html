<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Concept 3 · Drift</title>
<link rel="stylesheet" href="shared.css">
<style>
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#f3f6fa;color:#43505e;min-height:100vh;display:flex}
.rail{width:84px;padding:26px 0;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail .logo{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#bfe0f3,#f4d9e2);margin-bottom:18px}
.rail i{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-style:normal;color:#8ea0b2;font-size:18px}
.rail i.on{background:#fff;color:#4f86a8;box-shadow:0 6px 18px rgba(120,150,180,.2)}
main{flex:1;padding:26px 36px 40px 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.search{background:#fff;border-radius:999px;padding:12px 22px;width:340px;font-size:13px;color:#a2afbc;box-shadow:0 4px 16px rgba(120,150,180,.12)}
.av{display:flex;gap:10px;align-items:center;font-size:13px}.av b{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f6d8cf,#d8d4f1)}
.feature{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:34px}
.feature .big{height:330px;border-radius:34px;position:relative;box-shadow:0 18px 40px rgba(120,150,180,.2)}
.feature .cap{position:absolute;left:24px;bottom:22px;z-index:2;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-radius:20px;padding:14px 20px}
.cap h2{font-size:18px;font-weight:600;color:#38485a}.cap span{font-size:12px;color:#7d8d9d}
.side{display:grid;grid-template-rows:1fr 1fr;gap:20px}.side .ph{border-radius:28px;box-shadow:0 10px 26px rgba(120,150,180,.16)}
h3{font-size:15px;font-weight:600;margin-bottom:16px;color:#38485a;display:flex;justify-content:space-between}
h3 em{font-style:normal;font-weight:400;color:#8ea0b2;font-size:13px}
.albums{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.card{background:#fff;border-radius:26px;padding:10px 10px 16px;box-shadow:0 8px 24px rgba(120,150,180,.14)}
.card .ph{height:128px;border-radius:20px;margin-bottom:12px}
.card b{font-size:14px;font-weight:600;padding:0 6px;display:block}.card span{font-size:12px;color:#8ea0b2;padding:0 6px}
</style></head><body>
<div class="rail"><div class="logo"></div><i class="on">▦</i><i>◫</i><i>♡</i><i>⌖</i><i>⚙</i></div>
<main>
<div class="top"><div class="search">Search photos, places, people…</div><div class="av">Hi, Brenda <b></b></div></div>
<div class="feature"><div class="big ph p1"><div class="cap"><h2>On this day · 2 years ago</h2><span>Sintra, Portugal · 12 photos</span></div></div>
<div class="side"><div class="ph p4"></div><div class="ph p6"></div></div></div>
<h3>Albums <em>View all →</em></h3>
<div class="albums">
<div class="card"><div class="ph p2"></div><b>Lisbon</b><span>48 photos</span></div>
<div class="card"><div class="ph p3"></div><b>Garden</b><span>31 photos</span></div>
<div class="card"><div class="ph p5"></div><b>Coast</b><span>64 photos</span></div>
<div class="card"><div class="ph p4"></div><b>Family</b><span>22 photos</span></div>
<div class="card"><div class="ph p6"></div><b>Friends</b><span>57 photos</span></div>
</div></main></body></html>
