<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Concept 1 · Breeze</title>
<link rel="stylesheet" href="shared.css">
<style>
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;color:#3b4a5a;min-height:100vh;

nav{position:fixed;top:22px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px 8px 22px;border-radius:999px;background:rgba(255,255,255,.65);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(120,150,180,.18);z-index:5}
nav b{font-weight:600;letter-spacing:.14em;font-size:13px;margin-right:18px;color:#5a8fb0}

nav button{margin-left:8px;border:0;border-radius:999px;padding:9px 18px;font-size:13px;background:#6aa6c9;color:#fff}
header{text-align:center;padding:130px 20px 38px}
header h1{font-weight:300;font-size:52px;letter-spacing:-.02em;color:#34495c}
header p{margin-top:12px;color:#8798a8;font-size:15px}
.chips{display:flex;justify-content:center;gap:10px;margin:28px 0 36px}
.chips span{font-size:12.5px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.7);color:#6b7c8d;box-shadow:0 2px 10px rgba(120,150,180,.12)}
.chips .on{background:#e4f1f9;color:#3f7da3}
.grid{columns:4;column-gap:18px;max-width:1120px;margin:0 auto;padding:0 28px 60px}
.grid .ph{border-radius:26px;margin-bottom:18px;box-shadow:0 10px 30px rgba(130,160,190,.18)}
.t{height:200px}.m{height:260px}.l{height:330px}
