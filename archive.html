<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archive — mémoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4efe9;
      --sidebar-bg: #ede8e2;
      --border: #ddd8d1;
      --text: #1c1c1c;
      --text-muted: #888;
      --accent: #3d7a5c;
      --accent-hover: #2d5e44;
      --strip-bg: #e8e2da;
      --strip-hole: #cbc5bd;
      --caption: #999;
      --font-body: 'Jost', sans-serif;
      --font-serif: 'Cormorant Garamond', serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 180px;
      min-width: 180px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.2rem 0 1rem;
      overflow-y: auto;
    }

    .sidebar-logo {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 1.15rem;
      padding: 0 1.1rem 1.2rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .sidebar-logo a:hover { color: var(--accent); }

    .sidebar-section-label {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 1.1rem 0.4rem;
      font-weight: 400;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.3rem 1.1rem;
      font-size: 0.8rem;
      font-weight: 300;
      cursor: pointer;
      border-radius: 0;
      transition: background 0.15s;
      gap: 0.4rem;
    }

    .sidebar-item:hover { background: rgba(0,0,0,0.04); }
    .sidebar-item.active { background: rgba(0,0,0,0.06); }

    .sidebar-item-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .roll-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-count {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 0.8rem 0;
    }

    .sidebar-spacer { flex: 1; }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 1.8rem 2rem 3rem;
    }

    /* ── Top header ── */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.8rem;
    }

    .main-title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 1.8rem;
      letter-spacing: -0.01em;
    }

    .main-subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-top: 0.2rem;
    }

    .view-toggle {
      display: flex;
      gap: 0.3rem;
      align-items: center;
    }

    .view-btn {
      font-size: 0.7rem;
      font-family: var(--font-body);
      font-weight: 300;
      letter-spacing: 0.03em;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .view-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .view-btn:hover:not(.active) {
      background: rgba(0,0,0,0.05);
      color: var(--text);
    }

    /* ── Roll sections ── */
    .roll-section {
      margin-bottom: 3rem;
    }

    .roll-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }

    .roll-name {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 1.3rem;
      letter-spacing: -0.01em;
    }

    .roll-frame-count {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    /* ── Film Strip (strips view) ── */
    .film-strip-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      /* custom scrollbar */
      scrollbar-width: thin;
      scrollbar-color: var(--strip-hole) transparent;
      padding-bottom: 0.25rem;
    }

    .film-strip-wrapper::-webkit-scrollbar { height: 4px; }
    .film-strip-wrapper::-webkit-scrollbar-track { background: transparent; }
    .film-strip-wrapper::-webkit-scrollbar-thumb { background: var(--strip-hole); border-radius: 2px; }

    .film-strip {
      display: flex;
      gap: 0;
      background: var(--strip-bg);
      padding: 0;
      width: max-content;
    }

    /* sprocket rail */
    .sprocket-rail {
      height: 22px;
      background: var(--strip-bg);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 0;
    }

    .film-frame {
      display: flex;
      flex-direction: column;
      background: var(--strip-bg);
      flex-shrink: 0;
    }

    .sprocket-row {
      height: 22px;
      background: var(--strip-bg);
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 18px;
    }

    .sprocket-hole {
      width: 10px;
      height: 8px;
      background: var(--strip-hole);
      border-radius: 2px;
      opacity: 0.7;
    }

    .frame-img-wrap {
      position: relative;
      overflow: hidden;
      cursor: zoom-in;
    }

    .frame-img-wrap img {
      display: block;
      height: 300px;
      width: auto;
      min-width: 200px;
      max-width: 500px;
      object-fit: cover;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .frame-img-wrap:hover img {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .frame-caption {
      font-size: 0.65rem;
      color: var(--caption);
      font-weight: 300;
      text-align: center;
      padding: 0.3rem 0.5rem 0;
      font-style: italic;
      min-height: 1.2rem;
    }

    /* gap between frames inside strip */
    .film-frame + .film-frame {
      border-left: 2px solid var(--strip-bg);
    }

    /* ── Sheet view ── */
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.8rem;
    }

    .sheet-frame {
      aspect-ratio: 3/2;
      overflow: hidden;
      cursor: zoom-in;
    }

    .sheet-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .sheet-frame:hover img { transform: scale(1.03); }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .lightbox-inner img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-caption {
      color: rgba(255,255,255,0.55);
      font-size: 0.75rem;
      font-style: italic;
      font-family: var(--font-serif);
      font-weight: 300;
    }

    .lightbox-close {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      color: rgba(255,255,255,0.6);
      font-size: 1.5rem;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: color 0.2s;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      font-size: 1.8rem;
      cursor: pointer;
      padding: 1rem;
      transition: color 0.2s;
      line-height: 1;
    }

    .lightbox-nav:hover { color: #fff; }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }

    /* hide strips/sheet based on view */
    .app[data-view="sheet"] .film-strip-wrapper { display: none; }
    .app[data-view="strips"] .sheet-grid { display: none; }
  </style>
</head>
<body>
  <div class="app" data-view="strips" id="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo"><a href="index.html">mémoire</a></div>

      <div class="sidebar-section-label">Library</div>
      <div class="sidebar-item active" data-filter="all">
        <span class="sidebar-item-left">all frames</span>
        <span class="sidebar-count" id="total-frames">0</span>
      </div>
      <div class="sidebar-item" data-filter="rolls">
        <span class="sidebar-item-left">rolls</span>
        <span class="sidebar-count" id="total-rolls">0</span>
      </div>

      <div class="sidebar-divider"></div>
      <div class="sidebar-section-label">Rolls</div>
      <div id="sidebar-rolls"></div>

      <div class="sidebar-spacer"></div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="main-header">
        <div>
          <div class="main-title">all frames</div>
          <div class="main-subtitle" id="header-subtitle"></div>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="strips">strips</button>
          <button class="view-btn" data-view="sheet">sheet</button>
        </div>
      </div>

      <div id="rolls-container"></div>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">×</button>
    <button class="lightbox-nav lightbox-prev" id="lb-prev">‹</button>
    <div class="lightbox-inner">
      <img id="lb-img" src="" alt="">
      <div class="lightbox-caption" id="lb-caption"></div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lb-next">›</button>
  </div>

  <script src="photos.js"></script>
  <script>
    // ── Build UI ──────────────────────────────────────────
    const allFrames = ROLLS.flatMap(r => r.frames.map(f => ({ ...f, roll: r.name })));
    let lbIndex = 0;

    // Sidebar counts
    document.getElementById('total-frames').textContent = allFrames.length;
    document.getElementById('total-rolls').textContent = ROLLS.length;
    document.getElementById('header-subtitle').textContent =
      `${allFrames.length} exposure${allFrames.length !== 1 ? 's' : ''} · ${ROLLS.length} roll${ROLLS.length !== 1 ? 's' : ''}`;

    // Sidebar roll links
    const sidebarRolls = document.getElementById('sidebar-rolls');
    ROLLS.forEach(roll => {
      const el = document.createElement('div');
      el.className = 'sidebar-item';
      el.innerHTML = `
        <span class="sidebar-item-left">
          <span class="roll-dot" style="background:${roll.color}"></span>
          ${roll.name}
        </span>
        <span class="sidebar-count">${roll.frames.length}</span>
      `;
      el.addEventListener('click', () => {
        document.getElementById(roll.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      sidebarRolls.appendChild(el);
    });

    // Roll sections
    const container = document.getElementById('rolls-container');

    ROLLS.forEach(roll => {
      const section = document.createElement('div');
      section.className = 'roll-section';
      section.id = roll.id;

      // Roll header
      const header = document.createElement('div');
      header.className = 'roll-header';
      header.innerHTML = `
        <span class="roll-dot" style="background:${roll.color}"></span>
        <span class="roll-name">${roll.name}</span>
        <span class="roll-frame-count">${roll.frames.length} frame${roll.frames.length !== 1 ? 's' : ''}</span>
      `;
      section.appendChild(header);

      // Film strip wrapper
      const stripWrapper = document.createElement('div');
      stripWrapper.className = 'film-strip-wrapper';

      const strip = document.createElement('div');
      strip.className = 'film-strip';

      roll.frames.forEach((frame, fi) => {
        const globalIndex = allFrames.findIndex(f => f.src === frame.src && f.roll === roll.name);
        const filmFrame = document.createElement('div');
        filmFrame.className = 'film-frame';

        // sprockets top
        filmFrame.appendChild(makeSprockets());

        // image
        const imgWrap = document.createElement('div');
        imgWrap.className = 'frame-img-wrap';
        const img = document.createElement('img');
        img.src = frame.src;
        img.alt = frame.caption || '';
        img.loading = 'lazy';
        imgWrap.appendChild(img);
        imgWrap.addEventListener('click', () => openLightbox(globalIndex));
        filmFrame.appendChild(imgWrap);

        // caption
        const cap = document.createElement('div');
        cap.className = 'frame-caption';
        cap.textContent = frame.caption || '';
        filmFrame.appendChild(cap);

        // sprockets bottom
        filmFrame.appendChild(makeSprockets());

        strip.appendChild(filmFrame);
      });

      stripWrapper.appendChild(strip);
      section.appendChild(stripWrapper);

      // Sheet grid
      const grid = document.createElement('div');
      grid.className = 'sheet-grid';

      roll.frames.forEach((frame) => {
        const globalIndex = allFrames.findIndex(f => f.src === frame.src && f.roll === roll.name);
        const sf = document.createElement('div');
        sf.className = 'sheet-frame';
        const img = document.createElement('img');
        img.src = frame.src;
        img.alt = frame.caption || '';
        img.loading = 'lazy';
        sf.appendChild(img);
        sf.addEventListener('click', () => openLightbox(globalIndex));
        grid.appendChild(sf);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });

    function makeSprockets() {
      const row = document.createElement('div');
      row.className = 'sprocket-row';
      for (let i = 0; i < 5; i++) {
        const hole = document.createElement('div');
        hole.className = 'sprocket-hole';
        row.appendChild(hole);
      }
      return row;
    }

    // ── View toggle ───────────────────────────────────────
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('app').dataset.view = btn.dataset.view;
      });
    });

    // ── Lightbox ──────────────────────────────────────────
    function openLightbox(index) {
      lbIndex = index;
      updateLightbox();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      const frame = allFrames[lbIndex];
      document.getElementById('lb-img').src = frame.src;
      document.getElementById('lb-caption').textContent = frame.caption || '';
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    });

    document.getElementById('lb-prev').addEventListener('click', () => {
      lbIndex = (lbIndex - 1 + allFrames.length) % allFrames.length;
      updateLightbox();
    });

    document.getElementById('lb-next').addEventListener('click', () => {
      lbIndex = (lbIndex + 1) % allFrames.length;
      updateLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + allFrames.length) % allFrames.length; updateLightbox(); }
      if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % allFrames.length; updateLightbox(); }
    });
  </script>
</body>
</html>
