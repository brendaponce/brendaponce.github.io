<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archive — mémoire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #faf8f5;
      --sidebar-bg:  #f5f1ec;
      --border:      #ece7df;
      --text:        #2a2622;
      --text-muted:  #a89f96;
      --accent:      #7a9e8e;
      --strip-bg:    #f0ebe3;
      --strip-hole:  #ddd5ca;
      --caption:     #b8b0a7;
      --font-body:   'Jost', sans-serif;
      --font-serif:  'Cormorant Garamond', serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Fade-in for roll sections ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .roll-section {
      opacity: 0;
      animation: fadeUp 0.55s ease forwards;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 190px;
      min-width: 190px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 0 1rem;
      overflow-y: auto;
    }

    .sidebar-logo {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 1.2rem;
      padding: 0 1.3rem 1.5rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .sidebar-logo a { transition: color 0.2s; }
    .sidebar-logo a:hover { color: var(--accent); }

    .sidebar-section-label {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0 1.3rem 0.5rem;
      font-weight: 400;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.35rem 1.3rem;
      font-size: 0.78rem;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.2s;
      gap: 0.4rem;
      letter-spacing: 0.01em;
    }

    .sidebar-item:hover { background: rgba(0,0,0,0.03); }
    .sidebar-item.active { background: rgba(0,0,0,0.05); }

    .sidebar-item-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .roll-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
      opacity: 0.75;
    }

    .sidebar-count {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 1rem 0 0.6rem;
    }

    .sidebar-spacer { flex: 1; }

    /* ── Main ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 2.2rem 2.5rem 4rem;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-track { background: transparent; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Top header ── */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2.5rem;
    }

    .main-title {
      font-family: var(--font-serif);
      font-weight: 300;
      font-size: 1.9rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .main-subtitle {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-top: 0.3rem;
      letter-spacing: 0.03em;
    }

    .view-toggle {
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .view-btn {
      font-size: 0.68rem;
      font-family: var(--font-body);
      font-weight: 300;
      letter-spacing: 0.04em;
      padding: 0.28rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .view-btn:hover:not(.active) {
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* ── Roll sections ── */
    .roll-section {
      margin-bottom: 3.5rem;
    }

    .roll-header {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      margin-bottom: 0.8rem;
    }

    .roll-name {
      font-family: var(--font-serif);
      font-style: italic;
      font-weight: 300;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .roll-frame-count {
      font-size: 0.63rem;
      color: var(--text-muted);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    /* ── Film Strip ── */
    .film-strip-wrapper {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--strip-hole) transparent;
      padding-bottom: 0.5rem;
    }

    .film-strip-wrapper::-webkit-scrollbar { height: 3px; }
    .film-strip-wrapper::-webkit-scrollbar-track { background: transparent; }
    .film-strip-wrapper::-webkit-scrollbar-thumb { background: var(--strip-hole); border-radius: 2px; }

    .film-strip {
      display: flex;
      width: max-content;
      background: var(--strip-bg);
      /* very soft shadow so the strip floats slightly off the page */
      box-shadow: 0 2px 16px rgba(0,0,0,0.055);
    }

    .film-frame {
      display: flex;
      flex-direction: column;
      background: var(--strip-bg);
      flex-shrink: 0;
    }

    .film-frame + .film-frame {
      border-left: 1px solid rgba(0,0,0,0.06);
    }

    /* sprocket row — very delicate */
    .sprocket-row {
      height: 18px;
      background: var(--strip-bg);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 16px;
    }

    .sprocket-hole {
      width: 8px;
      height: 6px;
      background: var(--strip-hole);
      border-radius: 2px;
      opacity: 0.45;
    }

    .frame-img-wrap {
      overflow: hidden;
      cursor: zoom-in;
    }

    .frame-img-wrap img {
      display: block;
      height: 280px;
      width: auto;
      min-width: 180px;
      max-width: 480px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    /* photos stay original — only gentle scale on hover */
    .frame-img-wrap:hover img {
      transform: scale(1.015);
    }

    .frame-caption {
      font-size: 0.62rem;
      color: var(--caption);
      font-weight: 300;
      text-align: center;
      padding: 0.35rem 0.6rem 0;
      font-style: italic;
      font-family: var(--font-serif);
      min-height: 1.3rem;
      letter-spacing: 0.02em;
    }

    /* ── Sheet view ── */
    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.1rem;
    }

    .sheet-frame {
      aspect-ratio: 3/2;
      overflow: hidden;
      cursor: zoom-in;
      /* soft shadow — photos rest gently on the page */
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .sheet-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .sheet-frame:hover img { transform: scale(1.02); }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      /* soft blur backdrop instead of harsh black */
      background: rgba(18, 16, 14, 0.88);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .lightbox.open {
      display: flex;
      opacity: 1;
    }

    .lightbox-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      max-width: 90vw;
      max-height: 90vh;
    }

    .lightbox-inner img {
      max-width: 90vw;
      max-height: 82vh;
      object-fit: contain;
      display: block;
      /* very soft shadow so photo lifts off the backdrop */
      box-shadow: 0 8px 48px rgba(0,0,0,0.45);
    }

    .lightbox-caption {
      color: rgba(240,235,228,0.45);
      font-size: 0.78rem;
      font-style: italic;
      font-family: var(--font-serif);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .lightbox-close {
      position: fixed;
      top: 1.4rem;
      right: 1.8rem;
      color: rgba(240,235,228,0.4);
      font-size: 1.4rem;
      cursor: pointer;
      background: none;
      border: none;
      line-height: 1;
      transition: color 0.2s;
      font-weight: 300;
    }

    .lightbox-close:hover { color: rgba(240,235,228,0.85); }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(240,235,228,0.3);
      font-size: 2rem;
      cursor: pointer;
      padding: 1.2rem;
      transition: color 0.2s;
      line-height: 1;
      font-weight: 300;
    }

    .lightbox-nav:hover { color: rgba(240,235,228,0.8); }
    .lightbox-prev { left: 0.2rem; }
    .lightbox-next { right: 0.2rem; }

    /* counter indicator */
    .lightbox-counter {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: rgba(240,235,228,0.3);
      font-weight: 300;
    }

    /* view visibility */
    .app[data-view="sheet"] .film-strip-wrapper { display: none; }
    .app[data-view="strips"] .sheet-grid { display: none; }
  </style>
</head>
<body>
  <div class="app" data-view="strips" id="app">

    <aside class="sidebar">
      <div class="sidebar-logo"><a href="index.html">mémoire</a></div>

      <div class="sidebar-section-label">Library</div>
      <div class="sidebar-item active">
        <span class="sidebar-item-left">all frames</span>
        <span class="sidebar-count" id="total-frames">—</span>
      </div>
      <div class="sidebar-item">
        <span class="sidebar-item-left">rolls</span>
        <span class="sidebar-count" id="total-rolls">—</span>
      </div>

      <div class="sidebar-divider"></div>
      <div class="sidebar-section-label">Rolls</div>
      <div id="sidebar-rolls"></div>

      <div class="sidebar-spacer"></div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div>
          <div class="main-title">all frames</div>
          <div class="main-subtitle" id="header-subtitle"></div>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="strips">strips</button>
          <button class="view-btn" data-view="sheet">sheet</button>
        </div>
      </div>

      <div id="rolls-container"></div>
    </main>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">×</button>
    <button class="lightbox-nav lightbox-prev" id="lb-prev">‹</button>
    <div class="lightbox-inner">
      <img id="lb-img" src="" alt="">
      <div class="lightbox-caption" id="lb-caption"></div>
    </div>
    <button class="lightbox-nav lightbox-next" id="lb-next">›</button>
    <div class="lightbox-counter" id="lb-counter"></div>
  </div>

  <script src="photos.js"></script>
  <script>
    const allFrames = ROLLS.flatMap(r => r.frames.map(f => ({ ...f, roll: r.name })));
    let lbIndex = 0;

    // Sidebar counts
    document.getElementById('total-frames').textContent = allFrames.length;
    document.getElementById('total-rolls').textContent = ROLLS.length;
    document.getElementById('header-subtitle').textContent =
      `${allFrames.length} exposure${allFrames.length !== 1 ? 's' : ''} · ${ROLLS.length} roll${ROLLS.length !== 1 ? 's' : ''}`;

    // Sidebar roll list
    const sidebarRolls = document.getElementById('sidebar-rolls');
    ROLLS.forEach(roll => {
      const el = document.createElement('div');
      el.className = 'sidebar-item';
      el.innerHTML = `
        <span class="sidebar-item-left">
          <span class="roll-dot" style="background:${roll.color}"></span>
          ${roll.name}
        </span>
        <span class="sidebar-count">${roll.frames.length}</span>
      `;
      el.addEventListener('click', () => {
        document.getElementById(roll.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      sidebarRolls.appendChild(el);
    });

    // Build roll sections
    const container = document.getElementById('rolls-container');

    ROLLS.forEach((roll, rollIdx) => {
      const section = document.createElement('div');
      section.className = 'roll-section';
      section.id = roll.id;
      section.style.animationDelay = `${rollIdx * 0.12}s`;

      // Header
      const header = document.createElement('div');
      header.className = 'roll-header';
      header.innerHTML = `
        <span class="roll-dot" style="background:${roll.color};opacity:0.8;width:7px;height:7px;border-radius:50%;display:inline-block;"></span>
        <span class="roll-name">${roll.name}</span>
        <span class="roll-frame-count">${roll.frames.length} frame${roll.frames.length !== 1 ? 's' : ''}</span>
      `;
      section.appendChild(header);

      // Film strip
      const stripWrapper = document.createElement('div');
      stripWrapper.className = 'film-strip-wrapper';
      const strip = document.createElement('div');
      strip.className = 'film-strip';

      roll.frames.forEach((frame) => {
        const globalIndex = allFrames.findIndex(f => f.src === frame.src && f.roll === roll.name);
        const filmFrame = document.createElement('div');
        filmFrame.className = 'film-frame';
        filmFrame.appendChild(makeSprockets());

        const imgWrap = document.createElement('div');
        imgWrap.className = 'frame-img-wrap';
        const img = document.createElement('img');
        img.src = frame.src;
        img.alt = frame.caption || '';
        img.loading = 'lazy';
        imgWrap.appendChild(img);
        imgWrap.addEventListener('click', () => openLightbox(globalIndex));
        filmFrame.appendChild(imgWrap);

        const cap = document.createElement('div');
        cap.className = 'frame-caption';
        cap.textContent = frame.caption || '';
        filmFrame.appendChild(cap);

        filmFrame.appendChild(makeSprockets());
        strip.appendChild(filmFrame);
      });

      stripWrapper.appendChild(strip);
      section.appendChild(stripWrapper);

      // Sheet grid
      const grid = document.createElement('div');
      grid.className = 'sheet-grid';
      roll.frames.forEach((frame) => {
        const globalIndex = allFrames.findIndex(f => f.src === frame.src && f.roll === roll.name);
        const sf = document.createElement('div');
        sf.className = 'sheet-frame';
        const img = document.createElement('img');
        img.src = frame.src;
        img.alt = frame.caption || '';
        img.loading = 'lazy';
        sf.appendChild(img);
        sf.addEventListener('click', () => openLightbox(globalIndex));
        grid.appendChild(sf);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });

    function makeSprockets() {
      const row = document.createElement('div');
      row.className = 'sprocket-row';
      for (let i = 0; i < 5; i++) {
        const hole = document.createElement('div');
        hole.className = 'sprocket-hole';
        row.appendChild(hole);
      }
      return row;
    }

    // View toggle
    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('app').dataset.view = btn.dataset.view;
      });
    });

    // Lightbox
    function openLightbox(index) {
      lbIndex = index;
      updateLightbox();
      const lb = document.getElementById('lightbox');
      lb.style.display = 'flex';
      requestAnimationFrame(() => lb.classList.add('open'));
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      setTimeout(() => { lb.style.display = 'none'; }, 250);
      document.body.style.overflow = '';
    }

    function updateLightbox() {
      const frame = allFrames[lbIndex];
      document.getElementById('lb-img').src = frame.src;
      document.getElementById('lb-caption').textContent = frame.caption || '';
      document.getElementById('lb-counter').textContent = `${lbIndex + 1} / ${allFrames.length}`;
    }

    document.getElementById('lb-close').addEventListener('click', closeLightbox);
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    });
    document.getElementById('lb-prev').addEventListener('click', () => {
      lbIndex = (lbIndex - 1 + allFrames.length) % allFrames.length;
      updateLightbox();
    });
    document.getElementById('lb-next').addEventListener('click', () => {
      lbIndex = (lbIndex + 1) % allFrames.length;
      updateLightbox();
    });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') { lbIndex = (lbIndex - 1 + allFrames.length) % allFrames.length; updateLightbox(); }
      if (e.key === 'ArrowRight') { lbIndex = (lbIndex + 1) % allFrames.length; updateLightbox(); }
    });
  </script>
</body>
</html>
