<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Photo Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --strip: #1c1c1c;
      --border: #2a2a2a;
      --text: #2dd4bf;
      --text-bright: #5eead4;
      --muted: #4a9e94;
      --accent: #0d9488;
      --accent-light: #134e4a;
      --danger: #f87171;
      --perf: #000000;
      --frame-border: #333;
      --shadow: 0 4px 20px rgba(0,0,0,0.5);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.7);
      --radius: 4px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-film {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .logo-perf {
      width: 8px;
      height: 6px;
      background: var(--accent);
      border-radius: 1px;
    }

    .header-actions { display: flex; gap: 10px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 4px;
      border: none;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #0f766e; }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--accent);
    }
    .btn-outline:hover { background: var(--accent-light); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      padding: 6px 10px;
    }
    .btn-ghost:hover { background: var(--surface); color: var(--text); }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover { background: #ef4444; }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ── */
    aside {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
    }

    .sidebar-section-title {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 20px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      user-select: none;
      letter-spacing: 0.02em;
    }
    .nav-item:hover { background: rgba(45,212,191,0.05); color: var(--text); }
    .nav-item.active {
      background: var(--accent-light);
      color: var(--text-bright);
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 4px; bottom: 4px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 2px 2px 0;
    }

    .nav-item .count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--bg);
      padding: 1px 7px;
      border-radius: 10px;
      font-variant-numeric: tabular-nums;
    }

    .nav-album-actions {
      display: none;
      gap: 2px;
      margin-left: auto;
    }
    .nav-item:hover .nav-album-actions { display: flex; }
    .nav-item:hover .count { display: none; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1;
    }
    .icon-btn:hover { background: rgba(45,212,191,0.15); color: var(--text); }

    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 20px;
    }

    .sidebar-add-album { padding: 0 20px; }

    /* ── Main ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      background: var(--bg);
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .page-subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.03em;
    }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px;
      text-align: center;
      color: var(--muted);
      transition: all 0.2s;
      cursor: pointer;
      margin-bottom: 32px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
    }

    /* film holes decoration on upload zone */
    .upload-zone::before,
    .upload-zone::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 24px;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 6px,
        #000 6px,
        #000 18px,
        transparent 18px,
        transparent 24px
      );
      background-size: 100% 24px;
    }
    .upload-zone::before { left: 0; }
    .upload-zone::after { right: 0; }

    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(13,148,136,0.08);
      color: var(--text);
    }
    .upload-zone svg { margin-bottom: 10px; opacity: 0.5; }
    .upload-zone p { font-size: 0.9rem; font-weight: 500; letter-spacing: 0.03em; }
    .upload-zone span { font-size: 0.75rem; opacity: 0.6; letter-spacing: 0.05em; text-transform: uppercase; }

    /* ── Film Strips ── */
    .film-strips-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .film-strip {
      background: var(--strip);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .film-perforations {
      display: flex;
      align-items: center;
      padding: 5px 6px;
      background: #111;
      gap: 6px;
      overflow: hidden;
    }

    .perf {
      flex-shrink: 0;
      width: 16px;
      height: 11px;
      background: var(--perf);
      border-radius: 2px;
      border: 1px solid #2a2a2a;
    }

    .film-strip-photos {
      display: flex;
      gap: 3px;
      padding: 3px 6px;
      background: var(--strip);
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    .film-frame {
      flex-shrink: 0;
      width: 180px;
      aspect-ratio: 4/3;
      background: #000;
      border: 2px solid var(--frame-border);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }

    .film-frame:hover {
      border-color: var(--accent);
    }

    .film-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s, filter 0.3s;
      filter: sepia(10%) contrast(1.05);
    }

    .film-frame:hover img {
      transform: scale(1.06);
      filter: sepia(0%) contrast(1.1);
    }

    .film-frame-number {
      position: absolute;
      bottom: 4px;
      left: 6px;
      font-size: 0.6rem;
      color: rgba(45,212,191,0.6);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .film-frame-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .film-frame:hover .film-frame-overlay { opacity: 1; }

    .overlay-btn {
      background: rgba(45,212,191,0.15);
      border: 1px solid rgba(45,212,191,0.5);
      border-radius: 3px;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--text-bright);
      transition: background 0.15s;
    }
    .overlay-btn:hover { background: rgba(45,212,191,0.3); }
    .overlay-btn.danger {
      color: var(--danger);
      border-color: rgba(248,113,113,0.5);
      background: rgba(248,113,113,0.1);
    }
    .overlay-btn.danger:hover { background: rgba(248,113,113,0.25); }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state svg { opacity: 0.2; margin-bottom: 16px; }
    .empty-state h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; color: var(--text); letter-spacing: 0.04em; text-transform: uppercase; }
    .empty-state p { font-size: 0.875rem; }

    /* ── Modals ── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
      width: 420px;
      max-width: 95vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      transform: translateY(10px);
      transition: transform 0.2s;
    }
    .modal-backdrop.open .modal { transform: translateY(0); }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color 0.15s;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: #3a6e6b; }

    .form-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    /* ── Lightbox ── */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .lightbox-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    /* filmstrip strip along top of lightbox */
    .lightbox-filmstrip-top {
      position: fixed;
      top: 0;
      left: 0; right: 0;
      height: 14px;
      background: #111;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      overflow: hidden;
    }

    .lightbox-perf {
      flex-shrink: 0;
      width: 14px;
      height: 8px;
      background: #000;
      border: 1px solid #222;
      border-radius: 1px;
    }

    .lightbox-img {
      max-width: 88vw;
      max-height: 80vh;
      border-radius: 2px;
      box-shadow: 0 0 0 2px var(--frame-border), 0 30px 80px rgba(0,0,0,0.8);
      object-fit: contain;
    }

    .lightbox-close {
      position: fixed;
      top: 22px;
      right: 24px;
      background: rgba(45,212,191,0.1);
      border: 1px solid rgba(45,212,191,0.3);
      color: var(--text);
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .lightbox-close:hover { background: rgba(45,212,191,0.25); }

    .lightbox-info {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(45,212,191,0.08);
      color: var(--text);
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid rgba(45,212,191,0.2);
      backdrop-filter: blur(6px);
      text-align: center;
      letter-spacing: 0.04em;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(45,212,191,0.08);
      border: 1px solid rgba(45,212,191,0.25);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .lightbox-nav:hover { background: rgba(45,212,191,0.2); }
    .lightbox-prev { left: 20px; }
    .lightbox-next { right: 20px; }

    /* ── Move to album modal select ── */
    .album-list-select {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .album-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.875rem;
      color: var(--muted);
    }
    .album-option:hover { border-color: var(--accent); background: var(--accent-light); color: var(--text); }
    .album-option.selected { border-color: var(--accent); background: var(--accent-light); color: var(--text-bright); font-weight: 600; }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 500;
    }

    .toast {
      background: var(--accent);
      color: #fff;
      padding: 10px 18px;
      border-radius: 4px;
      font-size: 0.825rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: var(--shadow-hover);
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      aside { display: none; }
      main { padding: 20px 12px; }
      .film-frame { width: 130px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-film">
      <div class="logo-perf"></div>
      <div class="logo-perf"></div>
      <div class="logo-perf"></div>
    </div>
    My Gallery
    <div class="logo-film">
      <div class="logo-perf"></div>
      <div class="logo-perf"></div>
      <div class="logo-perf"></div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-outline" onclick="openAlbumModal()">+ New Album</button>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Upload Photos</button>
  </div>
</header>

<input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFileSelect(event)" />

<div class="layout">
  <!-- Sidebar -->
  <aside>
    <div class="sidebar-section-title">Library</div>
    <div class="nav-item active" data-view="all" onclick="setView('all')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      All Photos
      <span class="count" id="total-count">0</span>
    </div>

    <hr class="sidebar-divider" />
    <div class="sidebar-section-title">Albums</div>
    <div id="album-nav"></div>

    <div class="sidebar-add-album" style="margin-top:8px;">
      <button class="btn btn-ghost" style="width:100%;justify-content:flex-start;gap:8px;font-size:0.8rem;" onclick="openAlbumModal()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New Album
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main>
    <div class="page-header">
      <div>
        <div class="page-title" id="view-title">All Photos</div>
        <div class="page-subtitle" id="view-subtitle">Your entire collection</div>
      </div>
    </div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone"
         onclick="document.getElementById('fileInput').click()"
         ondragover="onDragOver(event)"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" display="block" style="margin:0 auto 10px;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p>Drop photos here or click to upload</p>
      <span>Supports JPG, PNG, GIF, WEBP</span>
    </div>

    <!-- Film Strips -->
    <div class="film-strips-container" id="photoGrid"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" display="block" style="margin:0 auto 16px;">
        <rect x="2" y="8" width="20" height="12" rx="2"/>
        <path d="M2 10h20M6 8V6M10 8V6M14 8V6M18 8V6"/>
      </svg>
      <h3 id="empty-title">No photos yet</h3>
      <p id="empty-desc">Upload some photos to get started</p>
    </div>
  </main>
</div>

<!-- Create/Edit Album Modal -->
<div class="modal-backdrop" id="albumModal" onclick="closeOnBackdrop(event,'albumModal')">
  <div class="modal">
    <div class="modal-title" id="albumModalTitle">New Album</div>
    <div class="form-group">
      <label class="form-label">Album Name</label>
      <input class="form-input" id="albumNameInput" placeholder="e.g. Summer 2024" onkeydown="if(event.key==='Enter')saveAlbum()" />
    </div>
    <div class="form-group">
      <label class="form-label">Description (optional)</label>
      <input class="form-input" id="albumDescInput" placeholder="A short description..." />
    </div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('albumModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAlbum()">Save Album</button>
    </div>
  </div>
</div>

<!-- Move to Album Modal -->
<div class="modal-backdrop" id="moveModal" onclick="closeOnBackdrop(event,'moveModal')">
  <div class="modal">
    <div class="modal-title">Add to Album</div>
    <div class="album-list-select" id="albumListSelect"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('moveModal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmMove()">Add to Album</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox-backdrop" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-filmstrip-top" id="lightboxFilmstripTop"></div>
  <button class="lightbox-close" onclick="closeLightboxDirect()">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)">&#8592;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="" />
  <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)">&#8594;</button>
  <div class="lightbox-info" id="lightboxInfo"></div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── State ──
let state = {
  photos: [],    // {id, name, src, albumIds, uploadedAt}
  albums: [],    // {id, name, desc, createdAt}
  currentView: 'all',
  editingAlbumId: null,
  movingPhotoId: null,
  selectedAlbumId: null,
  lightboxIndex: 0,
};

const STORAGE_KEY = 'photoGallery_v1';
const STRIP_SIZE = 5;

function save() {
  const data = {
    photos: state.photos.map(p => ({ id: p.id, name: p.name, albumIds: p.albumIds, uploadedAt: p.uploadedAt })),
    albums: state.albums,
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  state.photos.forEach(p => {
    try { localStorage.setItem(`photo_src_${p.id}`, p.src); } catch(e) {}
  });
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    state.albums = data.albums || [];
    state.photos = (data.photos || []).map(p => ({
      ...p,
      src: localStorage.getItem(`photo_src_${p.id}`) || ''
    })).filter(p => p.src);
  } catch(e) {}
}

// ── Render ──
function render() {
  renderAlbumNav();
  renderGrid();
  renderCounts();
}

function renderAlbumNav() {
  const nav = document.getElementById('album-nav');
  nav.innerHTML = state.albums.map(a => {
    const count = state.photos.filter(p => p.albumIds.includes(a.id)).length;
    return `
    <div class="nav-item ${state.currentView === a.id ? 'active' : ''}" onclick="setView('${a.id}')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(a.name)}</span>
      <span class="count">${count}</span>
      <span class="nav-album-actions">
        <button class="icon-btn" title="Rename" onclick="event.stopPropagation();openEditAlbum('${a.id}')">✎</button>
        <button class="icon-btn" title="Delete" onclick="event.stopPropagation();deleteAlbum('${a.id}')">✕</button>
      </span>
    </div>`;
  }).join('');
}

function renderCounts() {
  document.getElementById('total-count').textContent = state.photos.length;
}

function getViewPhotos() {
  if (state.currentView === 'all') return state.photos;
  return state.photos.filter(p => p.albumIds.includes(state.currentView));
}

function makePerforations(count) {
  return Array(count).fill('<div class="perf"></div>').join('');
}

function renderGrid() {
  const photos = getViewPhotos();
  const container = document.getElementById('photoGrid');
  const empty = document.getElementById('emptyState');

  if (photos.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    if (state.currentView === 'all') {
      document.getElementById('empty-title').textContent = 'No photos yet';
      document.getElementById('empty-desc').textContent = 'Upload some photos to get started';
    } else {
      const album = state.albums.find(a => a.id === state.currentView);
      document.getElementById('empty-title').textContent = 'Album is empty';
      document.getElementById('empty-desc').textContent = `Add photos to "${album?.name || 'this album'}" using the Add to Album option`;
    }
    return;
  }

  empty.style.display = 'none';

  // Group into filmstrips
  const strips = [];
  for (let i = 0; i < photos.length; i += STRIP_SIZE) {
    strips.push(photos.slice(i, i + STRIP_SIZE));
  }

  const perfCount = 30;
  const perfs = makePerforations(perfCount);

  container.innerHTML = strips.map((strip, si) => `
    <div class="film-strip">
      <div class="film-perforations">${perfs}</div>
      <div class="film-strip-photos">
        ${strip.map((p, fi) => {
          const globalIdx = si * STRIP_SIZE + fi;
          return `
          <div class="film-frame" onclick="openLightbox(${globalIdx})">
            <img src="${p.src}" alt="${escHtml(p.name)}" loading="lazy" />
            <div class="film-frame-number">${String(globalIdx + 1).padStart(2,'0')}</div>
            <div class="film-frame-overlay">
              <button class="overlay-btn" onclick="event.stopPropagation();openMove('${p.id}')">+ Album</button>
              <button class="overlay-btn danger" onclick="event.stopPropagation();deletePhoto('${p.id}')">Delete</button>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="film-perforations">${perfs}</div>
    </div>
  `).join('');
}

// ── Lightbox filmstrip ──
function initLightboxFilmstrip() {
  const top = document.getElementById('lightboxFilmstripTop');
  top.innerHTML = makePerforations(60);
}

// ── View ──
function setView(view) {
  state.currentView = view;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = view === 'all'
    ? document.querySelector('[data-view="all"]')
    : null;
  if (el) el.classList.add('active');

  const titleEl = document.getElementById('view-title');
  const subtitleEl = document.getElementById('view-subtitle');

  if (view === 'all') {
    titleEl.textContent = 'All Photos';
    subtitleEl.textContent = 'Your entire collection';
  } else {
    const album = state.albums.find(a => a.id === view);
    titleEl.textContent = album?.name || 'Album';
    subtitleEl.textContent = album?.desc || '';
  }

  render();
}

// ── Upload ──
function handleFileSelect(e) {
  handleFiles([...e.target.files]);
  e.target.value = '';
}

function onDragOver(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.add('drag-over');
}
function onDragLeave(e) {
  document.getElementById('uploadZone').classList.remove('drag-over');
}
function onDrop(e) {
  e.preventDefault();
  document.getElementById('uploadZone').classList.remove('drag-over');
  handleFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
}

function handleFiles(files) {
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const photo = {
        id: 'ph_' + Date.now() + '_' + Math.random().toString(36).slice(2),
        name: file.name.replace(/\.[^.]+$/, ''),
        src: e.target.result,
        albumIds: state.currentView !== 'all' ? [state.currentView] : [],
        uploadedAt: new Date().toISOString(),
      };
      state.photos.unshift(photo);
      loaded++;
      if (loaded === files.length) {
        save();
        render();
        toast(`${files.length} photo${files.length > 1 ? 's' : ''} uploaded`);
      }
    };
    reader.readAsDataURL(file);
  });
}

// ── Albums ──
function openAlbumModal() {
  state.editingAlbumId = null;
  document.getElementById('albumModalTitle').textContent = 'New Album';
  document.getElementById('albumNameInput').value = '';
  document.getElementById('albumDescInput').value = '';
  openModal('albumModal');
  setTimeout(() => document.getElementById('albumNameInput').focus(), 100);
}

function openEditAlbum(id) {
  const album = state.albums.find(a => a.id === id);
  if (!album) return;
  state.editingAlbumId = id;
  document.getElementById('albumModalTitle').textContent = 'Rename Album';
  document.getElementById('albumNameInput').value = album.name;
  document.getElementById('albumDescInput').value = album.desc || '';
  openModal('albumModal');
  setTimeout(() => document.getElementById('albumNameInput').focus(), 100);
}

function saveAlbum() {
  const name = document.getElementById('albumNameInput').value.trim();
  const desc = document.getElementById('albumDescInput').value.trim();
  if (!name) { document.getElementById('albumNameInput').focus(); return; }

  if (state.editingAlbumId) {
    const album = state.albums.find(a => a.id === state.editingAlbumId);
    if (album) { album.name = name; album.desc = desc; }
    toast('Album updated');
  } else {
    const album = {
      id: 'al_' + Date.now(),
      name,
      desc,
      createdAt: new Date().toISOString(),
    };
    state.albums.push(album);
    toast(`Album "${name}" created`);
  }

  closeModal('albumModal');
  save();
  render();
}

function deleteAlbum(id) {
  const album = state.albums.find(a => a.id === id);
  if (!album) return;
  if (!confirm(`Delete album "${album.name}"? Photos won't be deleted.`)) return;
  state.albums = state.albums.filter(a => a.id !== id);
  state.photos.forEach(p => { p.albumIds = p.albumIds.filter(aid => aid !== id); });
  if (state.currentView === id) setView('all');
  save();
  render();
  toast('Album deleted');
}

// ── Move to album ──
function openMove(photoId) {
  state.movingPhotoId = photoId;
  state.selectedAlbumId = null;
  const photo = state.photos.find(p => p.id === photoId);
  const list = document.getElementById('albumListSelect');

  if (state.albums.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:0.875rem;text-align:center;padding:20px;">No albums yet. Create one first!</p>';
  } else {
    list.innerHTML = state.albums.map(a => {
      const inAlbum = photo?.albumIds.includes(a.id);
      return `
      <div class="album-option ${inAlbum ? 'selected' : ''}" onclick="selectAlbumOption('${a.id}', this)" data-id="${a.id}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        ${escHtml(a.name)}
        ${inAlbum ? '<span style="margin-left:auto;font-size:0.72rem;color:var(--accent);font-weight:700;">✓ Added</span>' : ''}
      </div>`;
    }).join('');
  }

  openModal('moveModal');
}

function selectAlbumOption(id, el) {
  state.selectedAlbumId = id;
  document.querySelectorAll('.album-option').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
}

function confirmMove() {
  if (!state.movingPhotoId || !state.selectedAlbumId) {
    closeModal('moveModal');
    return;
  }
  const photo = state.photos.find(p => p.id === state.movingPhotoId);
  if (photo && !photo.albumIds.includes(state.selectedAlbumId)) {
    photo.albumIds.push(state.selectedAlbumId);
    const album = state.albums.find(a => a.id === state.selectedAlbumId);
    toast(`Added to "${album?.name}"`);
    save();
    render();
  }
  closeModal('moveModal');
}

// ── Delete photo ──
function deletePhoto(id) {
  if (!confirm('Delete this photo permanently?')) return;
  state.photos = state.photos.filter(p => p.id !== id);
  try { localStorage.removeItem(`photo_src_${id}`); } catch(e) {}
  save();
  render();
  toast('Photo deleted');
}

// ── Lightbox ──
function openLightbox(idx) {
  const photos = getViewPhotos();
  state.lightboxIndex = idx;
  updateLightbox(photos);
  document.getElementById('lightbox').classList.add('open');
}

function updateLightbox(photos) {
  photos = photos || getViewPhotos();
  const p = photos[state.lightboxIndex];
  if (!p) return;
  document.getElementById('lightboxImg').src = p.src;
  document.getElementById('lightboxImg').alt = p.name;
  document.getElementById('lightboxInfo').textContent =
    `${p.name}  ·  ${String(state.lightboxIndex + 1).padStart(2,'0')} / ${String(photos.length).padStart(2,'0')}`;
}

function lightboxNav(dir) {
  const photos = getViewPhotos();
  state.lightboxIndex = (state.lightboxIndex + dir + photos.length) % photos.length;
  updateLightbox(photos);
}

function closeLightbox(e) {
  if (e.target === document.getElementById('lightbox')) closeLightboxDirect();
}
function closeLightboxDirect() {
  document.getElementById('lightbox').classList.remove('open');
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'ArrowLeft') lightboxNav(-1);
    if (e.key === 'ArrowRight') lightboxNav(1);
    if (e.key === 'Escape') closeLightboxDirect();
  }
  if (e.key === 'Escape') {
    closeModal('albumModal');
    closeModal('moveModal');
  }
});

// ── Modal helpers ──
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeOnBackdrop(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// ── Toast ──
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ── Utils ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
load();
initLightboxFilmstrip();
render();
</script>
</body>
</html>
