<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zephyra · photo journal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--desk:#202023;--page:#0c0c0d;--line:rgba(255,255,255,.075);--ink:#f2f2f2;--ink2:#8b8b92;--tape:rgba(255,46,147,.88);--stamp:#ff2e93;--margin:#ff2e93;--tab:#ff2e93;--tabtxt:#0c0c0d;--accent:#ff2e93}
[data-theme=blue]{--tape:rgba(47,139,255,.9);--stamp:#2f8bff;--margin:#2f8bff;--tab:#2f8bff;--tabtxt:#fff;--accent:#2f8bff}
[data-theme=white]{--tape:rgba(236,230,214,.88);--stamp:#f2f2f2;--margin:rgba(255,255,255,.55);--tab:#f2f2f2;--tabtxt:#0c0c0d;--accent:#f2f2f2}
body{font-family:Georgia,'Iowan Old Style',serif;color:var(--ink);min-height:100vh;padding:40px 28px 60px;
background:radial-gradient(1200px 600px at 50% 0,rgba(255,255,255,.06),transparent 70%),var(--desk)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;z-index:50;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.page{position:relative;max-width:1180px;margin:0 auto;padding:34px 46px 56px 86px;min-height:80vh;background:var(--page);
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);
box-shadow:0 2px 0 rgba(0,0,0,.3),0 26px 50px rgba(0,0,0,.5),inset 0 0 70px rgba(0,0,0,.6);border-radius:3px}
.page::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55}
.holes{position:absolute;left:18px;top:0;bottom:0;width:22px;display:flex;flex-direction:column;justify-content:space-around;padding:60px 0}
.holes i{width:20px;height:20px;border-radius:50%;background:var(--desk);box-shadow:inset 0 3px 5px rgba(0,0,0,.6)}
header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;margin-bottom:22px;border-bottom:3px double var(--ink);gap:20px}
.kicker{font:700 11px 'Courier New',monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--ink2)}
h1{font:700 italic 64px/1 'Bradley Hand','Segoe Script','Brush Script MT','Snell Roundhand',cursive,Georgia;margin-top:6px}
h1 span{font:400 17px 'Courier New',monospace;letter-spacing:.08em;margin-left:14px;color:var(--ink2);font-style:normal}
.stamp{flex:none;width:104px;height:104px;border:3px solid var(--stamp);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--stamp);
font:700 12px/1.25 'Courier New',monospace;letter-spacing:.1em;transform:rotate(-11deg);outline:1.5px solid var(--stamp);outline-offset:-9px;opacity:.9}
.stamp b{font-size:26px;display:block;letter-spacing:0}
.tabs{display:flex;gap:6px;margin:0 0 14px;align-items:flex-end;flex-wrap:wrap;border-bottom:2px solid var(--ink)}
.tabs button{font:700 12px 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px 7px;background:var(--page);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;color:var(--ink);cursor:pointer;margin-bottom:-2px}
.tabs button:hover{border-color:var(--accent)}
.tabs button.on{background:var(--tab);color:var(--tabtxt);padding-top:13px;border-color:var(--tab)}
.tabs button.add{border-style:dashed;color:var(--ink2)}
.tabs .sp{flex:1}
.themes{display:flex;gap:8px;align-self:center;margin:0 4px 8px}
.themes button{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0;margin:0;background:none}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 24px;flex-wrap:wrap}
.hint{font:700 11px 'Courier New',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:700 12px 'Courier New',monospace;letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;background:var(--accent);color:var(--tabtxt);border:2px solid var(--accent);border-radius:4px;cursor:pointer;box-shadow:3px 3px 0 rgba(255,255,255,.18)}
[data-theme=white] .btn,[data-theme=white] .btn.ghost{color:#0c0c0d}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink2);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger:hover{border-color:#ff5a5a;color:#ff5a5a}
.grid{columns:4;column-gap:26px}
figure{color:#1d1d20;display:inline-block;width:100%;break-inside:avoid;position:relative;background:#fffdf7;padding:11px 11px 12px;margin:0 0 30px;box-shadow:0 1px 2px rgba(0,0,0,.4),0 10px 18px rgba(0,0,0,.45)}
figure:nth-child(3n+1){transform:rotate(-1.8deg)}figure:nth-child(3n+2){transform:rotate(1.4deg)}figure:nth-child(3n){transform:rotate(-.4deg)}
figure:nth-child(4n+2)::before{content:"";position:absolute;top:-13px;left:50%;width:84px;height:26px;margin-left:-42px;background:var(--tape);transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.3);clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,100% 0,97% 50%,100% 100%,6% 100%,3% 88%,0 100%)}
figure:not(:nth-child(4n+2))::before{content:"";position:absolute;top:-10px;left:-12px;width:62px;height:22px;background:var(--tape);transform:rotate(-36deg);box-shadow:0 1px 3px rgba(0,0,0,.3)}
figure img{display:block;width:100%;height:auto;cursor:zoom-in;background:#ddd}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 4px 0}
.t{font:italic 700 17px/1.15 'Bradley Hand','Segoe Script','Brush Script MT',cursive,Georgia;outline:none;min-width:2ch;flex:1;word-break:break-word;border-bottom:1px dashed transparent;cursor:text}
.t:hover,.t:focus{border-bottom-color:#b9b9c0}
.t:empty::before{content:"Add a title";color:#a5a5ac}
figcaption small{font:700 10px 'Courier New',monospace;letter-spacing:.12em;color:#77777e;flex:none}
.tools{position:absolute;z-index:3;top:6px;right:6px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
figure:hover .tools,figure:focus-within .tools{opacity:1}
@media (hover:none){.tools{opacity:1}}
.tools button{width:30px;height:30px;border-radius:50%;border:2px solid #1d1d20;background:#fffdf7;color:#1d1d20;font:700 14px/1 'Courier New',monospace;cursor:pointer;box-shadow:1px 2px 0 rgba(0,0,0,.35)}
.tools button:hover{background:var(--accent);color:var(--tabtxt)}
.empty{text-align:center;padding:70px 20px;color:var(--ink2)}
.note{display:inline-block;background:#fffdf7;color:#1d1d20;padding:30px 38px;transform:rotate(-1.5deg);box-shadow:0 12px 26px rgba(0,0,0,.5);position:relative;max-width:420px}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:80px;height:24px;margin-left:-40px;background:var(--tape);transform:rotate(3deg)}
.note h2{font:italic 700 28px 'Bradley Hand','Segoe Script','Brush Script MT',cursive,Georgia;margin-bottom:8px}
.note p{font:14px/1.5 Georgia;color:#555;margin-bottom:16px}
.drop{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:rgba(12,12,13,.82);font:700 22px 'Courier New',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:6px dashed var(--accent);margin:14px}
.drop.on{display:grid}
dialog{border:0;background:#fffdf7;color:#1d1d20;padding:26px 28px;max-width:92vw;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.65);transform:rotate(-.6deg);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{font:italic 700 26px 'Bradley Hand','Segoe Script','Brush Script MT',cursive,Georgia;margin-bottom:14px}
dialog input[type=text]{width:100%;font:16px Georgia;padding:10px 12px;border:2px solid #1d1d20;background:#fff;margin-bottom:16px}
dialog .row{display:flex;justify-content:flex-end;gap:10px}
dialog .btn.ghost{color:#1d1d20;border-color:#1d1d20}
dialog label{display:flex;gap:10px;align-items:center;padding:8px 2px;font:16px Georgia;cursor:pointer}
dialog label input{width:18px;height:18px;accent-color:var(--accent)}
.lb{position:fixed;inset:0;z-index:80;display:none;background:rgba(5,5,6,.93);align-items:center;justify-content:center;flex-direction:column;padding:30px}
.lb.on{display:flex}
.lb figure{transform:rotate(-.8deg);max-width:min(92vw,1000px);margin:0;display:block;width:auto}
.lb figure::before{display:block}
.lb img{max-width:100%;max-height:72vh;width:auto;cursor:default}
.lb .x,.lb .nav{position:fixed;background:#fffdf7;color:#1d1d20;border:2px solid #1d1d20;border-radius:50%;width:44px;height:44px;font:700 18px 'Courier New',monospace;cursor:pointer}
.lb .x{top:22px;right:24px}.lb .prev{left:22px;top:50%}.lb .next{right:22px;top:50%}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) rotate(-1deg);z-index:95;background:#fffdf7;color:#1d1d20;padding:10px 18px;font:700 12px 'Courier New',monospace;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:1000px){.grid{columns:3}}
@media (max-width:760px){.grid{columns:2;column-gap:18px}.page{padding:26px 18px 40px 46px}.page::before{left:34px}.holes{left:6px}.holes i{width:14px;height:14px}h1{font-size:44px}h1 span{display:none}.stamp{width:78px;height:78px;font-size:9px}.stamp b{font-size:18px}}
@media (max-width:480px){.grid{columns:1}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
  <header>
    <div><div class="kicker">Photo journal · Vol. 12</div><h1>Zephyra<span>— all the days, one page</span></h1></div>
    <div class="stamp"><div>EST.<b id="count">0</b>PHOTOS</div></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Albums"></nav>
  <div class="bar">
    <div class="hint" id="hint"></div>
    <div class="btns" id="btns"></div>
  </div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>
      <div class="note"><h2 id="emptyTitle">Your journal is empty</h2><p id="emptyText">Drop photos anywhere on this page, or press the button to pick them from your device.</p><button class="btn" id="emptyBtn">＋ Add photos</button></div>
    </div>
  </main>
</div>

<input type="file" id="file" accept="image/*" multiple hidden>
<div class="drop" id="drop">Drop photos to add them</div>

<dialog id="nameDlg"><h2 id="nameTitle">New album</h2><input type="text" id="nameInput" maxlength="40" placeholder="e.g. Summer 2026"><div class="row"><button class="btn ghost" id="nameCancel" type="button">Cancel</button><button class="btn" id="nameOk" type="button">Save</button></div></dialog>
<dialog id="albDlg"><h2>Put in albums</h2><div id="albList"></div><div class="row" style="margin-top:14px"><button class="btn ghost" id="albCancel" type="button">Cancel</button><button class="btn" id="albOk" type="button">Done</button></div></dialog>
<div class="lb" id="lb"><button class="x" id="lbX" aria-label="Close">✕</button><button class="nav prev" id="lbPrev" aria-label="Previous">←</button><figure><img id="lbImg" alt=""><figcaption><span class="t" id="lbT" style="cursor:default"></span><small id="lbD"></small></figcaption></figure><button class="nav next" id="lbNext" aria-label="Next">→</button></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- storage: photos in IndexedDB, albums + theme in localStorage ---------- */
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('zephyra-journal',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(mode,fn){const db=await dbp;return new Promise((res,rej)=>{const t=db.transaction('photos',mode);let out;try{out=fn(t.objectStore('photos'))}catch(e){return rej(e)}t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}

const state={photos:[],albums:LS.get('zj.albums',[]),view:'all',dlgPhoto:null,nameMode:null,lb:-1};
const urls=new Map();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const urlOf=p=>{if(!urls.has(p.id))urls.set(p.id,URL.createObjectURL(p.blob));return urls.get(p.id)};
const saveAlbums=()=>LS.set('zj.albums',state.albums);
const fmt=iso=>{const d=new Date(iso);return isNaN(d)?'':String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')};
const fmtLong=iso=>{const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})};
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}

/* ---------- theme ---------- */
function setTheme(t){document.documentElement.dataset.theme=t==='pink'?'':t;LS.set('zj.theme',t)}
setTheme(LS.get('zj.theme','pink'));

/* ---------- add photos ---------- */
async function shrink(file){
  const bmp=await createImageBitmap(file);
  const max=1800,k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.86));
}
async function addFiles(list){
  const files=[...list].filter(f=>f.type.startsWith('image/'));
  if(!files.length){toast('Those aren’t images');return}
  let ok=0,bad=0;
  for(const f of files){
    try{
      const blob=await shrink(f);
      const p={id:uid(),blob,title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,60),date:new Date(f.lastModified||Date.now()).toISOString(),added:Date.now(),albums:state.view!=='all'?[state.view]:[]};
      await tx('readwrite',s=>s.put(p));state.photos.unshift(p);ok++;
    }catch(e){bad++}
  }
  state.photos.sort((a,b)=>b.added-a.added);
  render();
  toast(ok?`Added ${ok} photo${ok>1?'s':''}`+(bad?` · ${bad} couldn’t be read`:''):'Couldn’t read those files');
}

/* ---------- render ---------- */
function visible(){return state.view==='all'?state.photos:state.photos.filter(p=>p.albums.includes(state.view))}
function render(){
  if(state.view!=='all'&&!state.albums.some(a=>a.id===state.view))state.view='all';
  $('count').textContent=state.photos.length;
  // tabs
  const tabs=$('tabs');tabs.innerHTML='';
  const mk=(label,id,cls)=>{const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;if(id===state.view)b.classList.add('on');b.onclick=()=>{if(id==='__new')openName('new');else{state.view=id;render()}};tabs.appendChild(b)};
  mk(`All · ${state.photos.length}`,'all');
  state.albums.forEach(a=>mk(`${a.name} · ${state.photos.filter(p=>p.albums.includes(a.id)).length}`,a.id));
  mk('＋ Album','__new','add');
  const sp=document.createElement('div');sp.className='sp';tabs.appendChild(sp);
  const th=document.createElement('div');th.className='themes';th.title='Accent colour';
  [['pink','#ff2e93'],['blue','#2f8bff'],['white','#f2f2f2']].forEach(([n,c])=>{const b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label',n+' accent');b.onclick=()=>setTheme(n);th.appendChild(b)});
  tabs.appendChild(th);
  // bar
  const album=state.albums.find(a=>a.id===state.view),list=visible();
  $('hint').textContent=album?`${album.name} — ${list.length} photo${list.length===1?'':'s'}`:`${state.photos.length} photo${state.photos.length===1?'':'s'} · newest first`;
  const btns=$('btns');btns.innerHTML='';
  const add=(t,cls,fn)=>{const b=document.createElement('button');b.type='button';b.className='btn '+(cls||'');b.textContent=t;b.onclick=fn;btns.appendChild(b)};
  if(album){add('Rename album','ghost',()=>openName('rename'));add('Delete album','ghost danger',()=>{if(confirm(`Delete the album “${album.name}”? The photos stay in All.`)){state.photos.forEach(p=>{p.albums=p.albums.filter(x=>x!==album.id);tx('readwrite',s=>s.put(p))});state.albums=state.albums.filter(a=>a.id!==album.id);saveAlbums();state.view='all';render();toast('Album deleted')}})}
  add('＋ Add photos','',()=>$('file').click());
  // grid
  const grid=$('grid');grid.innerHTML='';
  list.forEach((p,i)=>grid.appendChild(figure(p,i)));
  $('empty').hidden=list.length>0;
  if(!list.length){
    const all=state.view==='all';
    $('emptyTitle').textContent=all?'Your journal is empty':'This album is empty';
    $('emptyText').textContent=all?'Drop photos anywhere on this page, or press the button to pick them from your device.':'Add photos here, or open a photo in All and press ＋ to put it in this album.';
  }
}
function figure(p,i){
  const f=document.createElement('figure');
  const img=document.createElement('img');img.src=urlOf(p);img.alt=p.title||'Photo';img.loading='lazy';img.onclick=()=>openLb(i);f.appendChild(img);
  const cap=document.createElement('figcaption');
  const t=document.createElement('span');t.className='t';t.contentEditable='true';t.spellcheck=false;t.textContent=p.title;
  t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();t.blur()}};
  t.onblur=()=>{const v=t.textContent.trim().slice(0,60);t.textContent=v;if(v!==p.title){p.title=v;tx('readwrite',s=>s.put(p))}};
  const d=document.createElement('small');d.textContent=fmt(p.date);
  cap.append(t,d);f.appendChild(cap);
  const tools=document.createElement('div');tools.className='tools';
  const b1=document.createElement('button');b1.type='button';b1.textContent='＋';b1.title='Put in albums';b1.onclick=()=>openAlb(p);
  const b2=document.createElement('button');b2.type='button';b2.textContent='✕';b2.title='Delete photo';b2.onclick=()=>delPhoto(p);
  tools.append(b1,b2);f.appendChild(tools);
  return f;
}
async function delPhoto(p){
  if(!confirm('Delete this photo for good?'))return;
  await tx('readwrite',s=>s.delete(p.id));
  state.photos=state.photos.filter(x=>x.id!==p.id);
  if(urls.has(p.id)){URL.revokeObjectURL(urls.get(p.id));urls.delete(p.id)}
  render();toast('Photo deleted');
}

/* ---------- album dialogs ---------- */
function openName(mode){
  state.nameMode=mode;const a=state.albums.find(x=>x.id===state.view);
  $('nameTitle').textContent=mode==='new'?'New album':'Rename album';
  $('nameInput').value=mode==='rename'&&a?a.name:'';
  $('nameDlg').showModal();$('nameInput').focus();$('nameInput').select();
}
function saveName(){
  const v=$('nameInput').value.trim();if(!v){$('nameInput').focus();return}
  if(state.nameMode==='new'){const a={id:uid(),name:v};state.albums.push(a);state.view=a.id;toast('Album created')}
  else{const a=state.albums.find(x=>x.id===state.view);if(a)a.name=v;toast('Album renamed')}
  saveAlbums();$('nameDlg').close();render();
}
$('nameOk').onclick=saveName;$('nameCancel').onclick=()=>$('nameDlg').close();
$('nameInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveName()}};

function openAlb(p){
  state.dlgPhoto=p;const box=$('albList');box.innerHTML='';
  if(!state.albums.length){const m=document.createElement('p');m.style.cssText='font:15px/1.5 Georgia;color:#555';m.textContent='You have no albums yet. Close this and press “＋ Album” to make one.';box.appendChild(m)}
  state.albums.forEach(a=>{const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.value=a.id;c.checked=p.albums.includes(a.id);l.append(c,document.createTextNode(a.name));box.appendChild(l)});
  $('albDlg').showModal();
}
$('albOk').onclick=()=>{const p=state.dlgPhoto;if(p){p.albums=[...$('albList').querySelectorAll('input:checked')].map(c=>c.value);tx('readwrite',s=>s.put(p))}$('albDlg').close();render()};
$('albCancel').onclick=()=>$('albDlg').close();

/* ---------- lightbox ---------- */
function openLb(i){state.lb=i;showLb();$('lb').classList.add('on')}
function showLb(){const l=visible(),p=l[state.lb];if(!p)return closeLb();$('lbImg').src=urlOf(p);$('lbImg').alt=p.title;$('lbT').textContent=p.title||'Untitled';$('lbD').textContent=fmtLong(p.date)}
function closeLb(){$('lb').classList.remove('on');state.lb=-1}
function stepLb(d){const n=visible().length;if(!n)return;state.lb=(state.lb+d+n)%n;showLb()}
$('lbX').onclick=closeLb;$('lbPrev').onclick=()=>stepLb(-1);$('lbNext').onclick=()=>stepLb(1);
$('lb').onclick=e=>{if(e.target===$('lb'))closeLb()};
document.addEventListener('keydown',e=>{if(state.lb<0)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='ArrowRight')stepLb(1)});

/* ---------- file picking + drag & drop ---------- */
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('emptyBtn').onclick=()=>$('file').click();
let depth=0;
const hasFiles=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
addEventListener('dragenter',e=>{if(hasFiles(e)){depth++;$('drop').classList.add('on')}});
addEventListener('dragleave',e=>{if(hasFiles(e)){depth=Math.max(0,depth-1);if(!depth)$('drop').classList.remove('on')}});
addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()});
addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();depth=0;$('drop').classList.remove('on');addFiles(e.dataTransfer.files)});

/* ---------- start ---------- */
(async()=>{
  try{
    const all=await tx('readonly',s=>s.getAll());
    state.photos=(all||[]).sort((a,b)=>b.added-a.added);
  }catch(e){toast('Couldn’t open saved photos in this browser')}
  render();
})();
})();
</script>
</body>
</html>
